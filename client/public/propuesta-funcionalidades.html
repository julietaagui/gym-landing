<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Propuesta · Funcionalidades GymCross</title>
    <style>
      :root { color-scheme: dark; font-family: Roboto, Arial, sans-serif; background: #0c1e30; color: #fff; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0c1e30; }
      .section { width: min(100%, 1440px); min-height: 100vh; margin: auto; padding: clamp(32px, 5vw, 76px) clamp(24px, 6vw, 88px) 54px; overflow: hidden; }
      .intro { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr); align-items: center; gap: 36px; min-height: 230px; }
      h1 { max-width: 780px; margin: 0 0 18px; font-size: clamp(38px, 3.8vw, 50px); line-height: .94; letter-spacing: -.07em; font-weight: 900; }
      .description { max-width: 650px; margin: 0; color: #e2ebf5; font-size: clamp(14px, 1.15vw, 17px); line-height: 1.55; }
      .visual { position: relative; min-height: 210px; }
      .section-no { position: absolute; top: -15px; right: 0; color: rgba(57, 133, 255, .12); font-size: 300px; font-weight: 900; line-height: .78; letter-spacing: -.04em; }
      .eyebrow { position: absolute; top: 57px; right: 80px; z-index: 1; color: #d7f75b; font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      .rope { position: absolute; right: 4px; bottom: -4px; z-index: 1; width: 96px; height: 96px; object-fit: contain; }
      .switcher { display: flex; justify-content: center; gap: 22px; width: fit-content; margin: 4px auto 30px; border-bottom: 1px solid rgba(255,255,255,.16); }
      .switcher button { position: relative; min-height: 30px; padding: 0 2px 9px; border: 0; border-radius: 0; background: transparent; color: rgba(255,255,255,.62); cursor: pointer; font: 700 12px/1 Roboto, Arial, sans-serif; transition: color .2s ease; }
      .switcher button.active { color: #fff; }
      .switcher button.active::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 3px; border-radius: 3px 3px 0 0; background: #3985ff; content: ""; }
      .showcase { display: grid; grid-template-columns: minmax(0, 1fr) 300px; align-items: center; gap: 28px; width: min(100%, 1050px); margin: 0 auto; }
      .device { display: flex; min-height: 410px; align-items: center; justify-content: center; }
      .device img { display: block; width: min(100%, 660px); max-height: 430px; object-fit: contain; }
      .list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
      .list button { display: grid; grid-template-columns: 25px 34px 1fr; align-items: center; gap: 8px; width: 100%; min-height: 46px; padding: 0; border: 0; background: transparent; color: #fff; text-align: left; font: 700 15px/1.2 Roboto, Arial, sans-serif; }
      .list button.active { color: #3985ff; }
      .list .dot { width: 11px; height: 11px; border-radius: 50%; background: transparent; }
      .list button.active .dot { background: #3985ff; box-shadow: 0 4px 0 #071421; }
      .list .number { font-size: 20px; }
      .list .name { font-size: 14px; }
      @media (max-width: 760px) {
        .section { padding: 38px 24px; }
        .intro { grid-template-columns: minmax(0, 1fr) 180px; gap: 12px; min-height: 210px; }
        h1 { font-size: clamp(36px, 7vw, 54px); }
        .visual { min-height: 175px; }
        .section-no { font-size: 170px; }
        .eyebrow { top: 45px; right: 48px; font-size: 8px; }
        .rope { width: 72px; height: 72px; }
        .showcase { grid-template-columns: minmax(0, 1fr) 220px; gap: 12px; }
      }
      @media (max-width: 560px) {
        .section { padding: 30px 20px; }
        .intro { grid-template-columns: minmax(0, 1fr) 105px; min-height: 190px; }
        h1 { font-size: clamp(29px, 8vw, 40px); }
        .description { font-size: 13px; }
        .visual { min-height: 140px; }
        .section-no { top: 5px; right: 0; font-size: 112px; }
        .eyebrow { top: 36px; right: 31px; font-size: 6px; }
        .rope { width: 58px; height: 58px; }
        .switcher { margin: 12px auto 18px; }
        .showcase { grid-template-columns: 1fr; }
        .device { min-height: 280px; }
        .device img { max-height: 290px; }
        .list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; }
        .list button { grid-template-columns: 16px 27px minmax(0, 1fr); gap: 5px; min-height: 42px; }
        .list .name { font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <main class="section">
      <header class="intro">
        <div>
          <h1>Todo lo que tu gimnasio<br />necesita, en un solo lugar</h1>
          <p class="description">GymCross centraliza clientes, entrenamientos, agenda, pagos y métricas en una experiencia rápida, intuitiva y moderna.</p>
        </div>
        <div class="visual" aria-hidden="true">
          <span class="section-no">02</span>
          <span class="eyebrow">Funcionalidad</span>
          <img class="rope" src="/src/assets/gymcross-cuerda-saltar-loop.gif" alt="" />
        </div>
      </header>
      <div class="switcher" role="tablist" aria-label="Vista de la aplicación">
        <button class="active" type="button" role="tab" aria-selected="true">Administradores</button>
        <button type="button" role="tab" aria-selected="false">Usuarios</button>
      </div>
      <div class="showcase">
        <div class="device"><img src="/src/assets/appointment.png" alt="Vista del panel de turnos de GymCross" /></div>
        <ul class="list" aria-label="Funciones del panel">
          <li><button class="active" type="button"><span class="dot"></span><span class="number">01</span><span class="name">Turnos</span></button></li>
          <li><button type="button"><span class="dot"></span><span class="number">02</span><span class="name">Usuarios</span></button></li>
          <li><button type="button"><span class="dot"></span><span class="number">03</span><span class="name">Caja y Pagos</span></button></li>
          <li><button type="button"><span class="dot"></span><span class="number">04</span><span class="name">Métricas</span></button></li>
          <li><button type="button"><span class="dot"></span><span class="number">05</span><span class="name">Rutinas y Ejercicios</span></button></li>
        </ul>
      </div>
    </main>
  </body>
</html>
